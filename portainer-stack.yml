# =============================================================================
# Muninn - HQ deployment stack
#
# This file is the GitOps source of truth for the hq_muninn Portainer stack.
# The image tag on the `muninn` service line is pinned by CI on every push
# to main. Do not edit the tag by hand; it will be overwritten on the next
# build. To roll back, revert the pin commit and the webhook fires
# automatically.
#
# Data: all state under /opt/HQ_Muninn (bind-mounted, Tier 1 PBS backup).
# Secrets: resolved via *_FILE env vars from read-only bind mounts. Never
# commit actual values here.
# =============================================================================

services:
  muninn:
    image: ghcr.io/emkraan/muninn:sha-f514036 # pinned by CI -- do not edit
    container_name: HQ_Muninn
    restart: always
    environment:
      - SECRET_ENCRYPTION_KEY_FILE=/run/secrets/secret_encryption_key
      - DB_DIALECT=postgresql
      - DB_DRIVER=node-postgres
      - DB_URL_FILE=/run/secrets/db_url
      - REDIS_IS_EXTERNAL=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DATABASE_INDEX=1
      - AUTH_PROVIDERS=credentials
      - AUTH_COOKIE_PREFIX=homarr
      - BRAND_ATTRIBUTION=Emkraan
      - 'BRAND_ATTRIBUTION_LOGO=data:image/png;base64,'
    extra_hosts:
      # auth.emkraan.com resolves to an external IP unreachable from inside
      # Docker. HQ_PangolinGerbil owns 172.18.0.36 on the backend network and
      # Traefik shares its network namespace, so port 443 is reachable directly
      # (same bridge, no NAT) for server-side OIDC calls.
      - "auth.emkraan.com:172.18.0.36"
    ports:
      - "0.0.0.0:13066:7575"
    volumes:
      - /opt/HQ_Muninn/appdata:/appdata
      - /opt/HQ_Muninn/secrets/secret_encryption_key:/run/secrets/secret_encryption_key:ro
      - /opt/HQ_Muninn/secrets/db_url:/run/secrets/db_url:ro
    networks:
      - default
      - backend

networks:
  backend:
    external: true
  default: {}
