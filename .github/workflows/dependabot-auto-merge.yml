name: Dependabot auto-merge

# Generic variant of dependabot-auto-merge.yml: waits for every OTHER check
# on the PR's head SHA to report a passing conclusion, instead of polling one
# or more named checks. This needs zero per-repo customization, so the fleet
# auto-remediation job (see docs/standards/dependabot-auto-merge-standard.md
# "Auto-remediation") can provision it into a brand-new repo unattended.
#
# Only safe when the repo has no third-party check-suite App (Vercel, etc.)
# installed: a GITHUB_TOKEN can never read a check-suite owned by a
# DIFFERENT App (confirmed empirically - see dependabot-auto-merge-standard.md),
# so the unfiltered check-runs list would 403 there. The remediation job
# verifies this before ever committing this file; a repo that later adds a
# third-party CI App needs the hand-tailored named-check variant instead
# (dependabot-auto-merge.yml, not this file) - same as every existing repo
# with Vercel installed.
#
# Also only safe because the remediation job verifies the repo already has
# at least one OTHER pull_request-triggered check before provisioning this -
# a repo with zero CI would otherwise auto-merge on nothing.
#
# See emkraan-studio's dependabot-auto-merge.yml for the full rationale
# behind pull_request_target, the missing approval step, and re-dispatching
# a deploy workflow after merge (append that step by hand here if this repo
# later gains a build-and-deploy.yml / docker-publish.yml of its own).

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Wait for checks and merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' || steps.metadata.outputs.package-ecosystem == 'github_actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 60); do
            runs="$(gh api "repos/$REPO/commits/$SHA/check-runs" | jq -c '[.check_runs[] | select(.name != "auto-merge")]')"
            count="$(echo "$runs" | jq 'length')"
            if [ "$count" -eq 0 ]; then
              echo "No other checks reported yet (attempt $i)..."
              sleep 15
              continue
            fi
            pending="$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')"
            if [ "$pending" -gt 0 ]; then
              echo "Waiting on $pending check(s) still running..."
              sleep 15
              continue
            fi
            failing="$(echo "$runs" | jq -c '[.[] | select((.conclusion != "success") and (.conclusion != "neutral") and (.conclusion != "skipped"))]')"
            bad="$(echo "$failing" | jq 'length')"
            if [ "$bad" -gt 0 ]; then
              echo "$(echo "$failing" | jq -r '.[].name') did not pass."
              exit 1
            fi
            echo "All other checks passed."
            gh pr merge --squash --delete-branch "$PR_URL"
            exit 0
          done
          echo "Timed out waiting for checks."
          exit 1
