name: PR checks

# Lint + typecheck on every pull request. This is the real gate the Dependabot
# auto-merge workflow waits on (see dependabot-auto-merge.yml), so a dependency
# bump that breaks types or linting can never merge itself. The full build
# stays on build-and-deploy.yml (push/tag), which runs after a merge lands on
# main - keeping the PR gate fast and within the runner's memory.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "true"
      CI: "true"
      # turbo runs tsc across ~35 packages at once; at full concurrency the
      # runner OOM-kills the job. Cap the per-process heap and the parallelism
      # (--concurrency below) so typecheck fits the runner's memory.
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Call turbo directly so --concurrency is parsed by turbo (bounding
      # parallel tsc for memory), not forwarded through to tsc. Typecheck is the
      # gate (compilation validity - the meaningful signal for a dependency
      # bump). Lint is intentionally not part of the gate yet: the Homarr fork
      # carries pre-existing oxlint findings that a clean CI run surfaces, so
      # blocking on it would block every PR until a separate lint-debt cleanup.
      - name: Typecheck
        run: pnpm exec turbo typecheck --concurrency=2

      - name: No em dashes
        run: |
          python3 - << 'PYEOF'
          import sys, pathlib
          DASHES = '\u2013\u2014\u2015'
          SKIP = {'.git', '.github', 'node_modules', '__pycache__', 'dist', 'build'}
          found = False
          # Check all *.md files
          for path in sorted(pathlib.Path('.').rglob('*.md')):
              if any(p in SKIP for p in path.parts):
                  continue
              try:
                  lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              except Exception as e:
                  print(f'::warning::Could not read {path}: {e}')
                  continue
              for lineno, line in enumerate(lines, 1):
                  if any(ch in line for ch in DASHES):
                      print(f'::error file={path},line={lineno}::Em/en dash found. Use a hyphen, comma, or colon.')
                      found = True
          # Check English translation source files (CJK files are exempt)
          for relpath in ['packages/translation/src/lang/en.json', 'packages/translation/src/lang/en-gb.json']:
              path = pathlib.Path(relpath)
              if not path.exists():
                  continue
              try:
                  lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              except Exception as e:
                  print(f'::warning::Could not read {path}: {e}')
                  continue
              for lineno, line in enumerate(lines, 1):
                  if any(ch in line for ch in DASHES):
                      print(f'::error file={path},line={lineno}::Em/en dash found. Use a hyphen, comma, or colon.')
                      found = True
          if found:
              sys.exit(1)
          PYEOF

      # Guards the documentation base URL against the half-finished rebrand that
      # left every "Read the docs" link pointing at a 404. Targeted rather than
      # `pnpm test`, which pulls in live-network and testcontainers suites.
      - name: Documentation link tests
        run: pnpm exec vitest run packages/definitions/src/test/docs.spec.ts

  ci:
    name: ci
    needs: [check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
