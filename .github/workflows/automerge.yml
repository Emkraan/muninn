name: automerge

# Repo-level auto-merge for BOTH plain repos and merge-queue repos.
#
# Triggered by workflow_run on this repo's CI workflow completing, NOT
# check_suite: GitHub creates no workflow runs from events triggered by
# GITHUB_TOKEN, so check_suite.completed never re-fires this workflow and a PR
# that went green after its open-time run sat stranded (clean but never merged).
# workflow_run chains off a named workflow finishing and is not blocked that way.
#
# A PR is ready when mergeStateStatus is CLEAN, OR UNSTABLE with mergeable
# MERGEABLE: a failing/pending REQUIRED check reads BLOCKED, so UNSTABLE means
# branch protection is satisfied and only a non-required context (often this
# automerge run itself, in progress) is not green. Gating on strict CLEAN let a
# PR pin itself open forever behind its own run.
#
# Branch protection (required reviews/checks) still fully applies: the enqueue
# and merge mutations enforce it, and expectedHeadOid guards the direct merge.
#
# The event triggers alone are not enough: a PR can go green, get enqueued, then
# fall OUT of the merge queue (a queue hiccup, a preceding entry's merge, a
# timeout) without ever merging, and with no further PR event to re-fire this
# workflow it sits clean-but-open forever (this stranded a pin PR >24h and fired
# the Pin-PR-Stuck alert). The scheduled sweep below is the safety net: it walks
# every open non-draft PR and re-enqueues/merges any that are ready. Keep it.
# workflow_dispatch runs the same sweep on demand to unstick a stranded PR now.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["PR checks"]
    types: [completed]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;

            let numbers = [];
            if (context.eventName === 'pull_request' || context.eventName === 'pull_request_review') {
              numbers = [context.payload.pull_request.number];
            } else if (context.eventName === 'workflow_run') {
              numbers = (context.payload.workflow_run.pull_requests || []).map(p => p.number);
            } else if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              // Safety-net sweep: every open, non-draft PR. Recovers a green PR
              // that stranded with no pending event to re-trigger the paths above.
              const open = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100,
              });
              numbers = open.filter(p => !p.draft).map(p => p.number);
            }
            if (numbers.length === 0) { core.info('no candidate PRs'); return; }

            const Q = `query($o:String!,$r:String!,$n:Int!){
              repository(owner:$o,name:$r){
                mergeQueue{ id }
                pullRequest(number:$n){
                  id number isDraft state merged isInMergeQueue mergeStateStatus mergeable headRefOid
                }
              }
            }`;
            const ENQUEUE = `mutation($id:ID!){ enqueuePullRequest(input:{pullRequestId:$id}){ mergeQueueEntry{ position } } }`;
            const AUTOMERGE = `mutation($id:ID!){ enablePullRequestAutoMerge(input:{pullRequestId:$id, mergeMethod:SQUASH}){ pullRequest{ number } } }`;
            const MERGE = `mutation($id:ID!,$oid:GitObjectID!){ mergePullRequest(input:{pullRequestId:$id, mergeMethod:SQUASH, expectedHeadOid:$oid}){ pullRequest{ number merged } } }`;
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            const isReady = (pr) =>
              pr.mergeStateStatus === 'CLEAN' ||
              (pr.mergeStateStatus === 'UNSTABLE' && pr.mergeable === 'MERGEABLE');

            for (const n of numbers) {
              let data;
              for (let i = 0; i < 6; i++) {
                data = await github.graphql(Q, {o: owner, r: repo, n});
                if (data.repository.pullRequest.mergeStateStatus !== 'UNKNOWN') break;
                await sleep(5000);
              }
              const pr = data.repository.pullRequest;
              const hasQueue = !!data.repository.mergeQueue;
              if (!pr || pr.state !== 'OPEN' || pr.merged) { core.info(`#${n}: not an open PR`); continue; }
              if (pr.isDraft) { core.info(`#${n}: draft, skipping`); continue; }
              if (pr.isInMergeQueue) { core.info(`#${n}: already in merge queue`); continue; }

              const ready = isReady(pr);
              if (hasQueue) {
                if (ready) {
                  try { await github.graphql(ENQUEUE, {id: pr.id}); core.info(`#${n}: enqueued`); }
                  catch (e) { core.info(`#${n}: enqueue not accepted yet (${e.message})`); }
                } else {
                  core.info(`#${n}: mergeStateStatus=${pr.mergeStateStatus}, waiting for a later workflow_run event`);
                }
              } else {
                if (ready) {
                  try {
                    await github.graphql(MERGE, {id: pr.id, oid: pr.headRefOid});
                    core.info(`#${n}: merged (squash)`);
                    continue;
                  } catch (e) {
                    core.info(`#${n}: direct merge not accepted (${e.message}); falling back to auto-merge`);
                  }
                }
                try { await github.graphql(AUTOMERGE, {id: pr.id}); core.info(`#${n}: auto-merge enabled`); }
                catch (e) { core.info(`#${n}: auto-merge enable skipped (${e.message})`); }
              }
            }
