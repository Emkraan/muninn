name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Typecheck (web)
        run: yarn workspace @linkwarden/web exec tsc --noEmit

      - name: Unit tests
        run: yarn vitest run
