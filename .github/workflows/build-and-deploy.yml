# ===========================================================================
# Muninn - build, publish, pin, and deploy.
#
# Muninn is a fork of Homarr (Apache-2.0).
#
# Triggers:
#   push to main            -> :latest, :edge, :sha-<short-sha>
#   push of a v* git tag    -> additionally the bare semver X.Y.Z
#   manual (workflow_dispatch)
#
# On every push to main the workflow also pins the new sha tag into
# portainer-stack.yml, commits back to main with [skip ci], and fires
# the Portainer webhook to redeploy hq_muninn.
#
# Image: ghcr.io/emkraan/muninn
# ===========================================================================

name: build-and-deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: emkraan/muninn

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags and metadata
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          APP_VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || echo '0.0.0')"
          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          TAGS="${IMAGE}:latest"
          TAGS="${TAGS},${IMAGE}:edge"
          TAGS="${TAGS},${IMAGE}:sha-${SHORT_SHA}"

          # When a v* git tag triggers the build, also publish the bare semver.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "${GITHUB_REF_NAME}" ]; then
            SEMVER="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS},${IMAGE}:${SEMVER}"
          fi

          {
            echo "tags=${TAGS}"
            echo "app_version=${APP_VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

          echo "Publishing tags:"
          echo "${TAGS}" | tr ',' '\n'

      # Homarr's Dockerfile is a self-contained multi-stage build (pnpm fetch/
      # install/turbo build -> alpine runner with nginx+redis+next). The TURBO_*
      # secret mounts are optional (build proceeds without a remote cache).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Muninn
            org.opencontainers.image.description=Self-hosted dashboard and app launcher (fork of Homarr) with a Cobalt UI, strict per-user RBAC, multi-provider OIDC, and a documented REST API.
            org.opencontainers.image.source=https://github.com/Emkraan/muninn
            org.opencontainers.image.url=https://github.com/Emkraan/muninn
            org.opencontainers.image.documentation=https://github.com/Emkraan/muninn
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.meta.outputs.app_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}

      - name: Mint deploy-bot app token
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@v3
        id: deploy-token
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - name: Configure git for pin commit
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ steps.deploy-token.outputs.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # actions/checkout sets a GITHUB_TOKEN extraheader that wins over the remote URL.
          # Unset it so the app-token URL below is actually used (and the bypass applies).
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Pin portainer-stack.yml to new sha tag
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          NEW_TAG: sha-${{ steps.meta.outputs.short_sha }}
        run: |
          sed -i -E "s|(image:[[:space:]]+)${IMAGE}:[A-Za-z0-9._-]+|\1${IMAGE}:${NEW_TAG}|" portainer-stack.yml
          if git diff --quiet portainer-stack.yml; then
            echo "portainer-stack.yml already at ${NEW_TAG}; nothing to commit"
          else
            git add portainer-stack.yml
            git commit -m "chore: pin muninn -> ${NEW_TAG} [skip ci]"
            git push
          fi

      - name: Trigger Portainer redeploy (hq_muninn)
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          vars.PORTAINER_WEBHOOK_ENABLED == 'true'
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
