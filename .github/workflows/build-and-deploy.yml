# ===========================================================================
# Muninn - build, publish, pin, and deploy.
#
# Muninn is a fork of Homarr (Apache-2.0).
#
# Triggers:
#   push to main            -> :latest, :edge, :sha-<short-sha>
#   push of a v* git tag    -> additionally the bare semver X.Y.Z
#   manual (workflow_dispatch)
#
# Pin-to-live WITHOUT bypassing the merge queue:
#   A real push to main builds and pushes the image, then opens an auto-merge
#   "pin" PR that updates portainer-stack.yml to the new sha tag. That PR flows
#   through the merge queue like any other change (no direct push to main, no
#   ruleset bypass). When it merges, the squash commit lands on main with the
#   "chore: pin muninn ->" title; that push re-triggers this workflow in
#   webhook-only mode, which fires the Portainer webhook to redeploy hq_muninn.
#   The webhook-only pass makes no commit, so there is no deploy loop.
#
# Image: ghcr.io/emkraan/muninn
# ===========================================================================

name: build-and-deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: emkraan/muninn

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # Route the run. A push to main whose head commit is the pin commit is the
  # post-merge pass: skip the build and just fire the redeploy webhook.
  # Everything else (real code push, tag, manual) is a full build.
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.m.outputs.mode }}
    steps:
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          mode=build
          if [ "${EVENT}" = "push" ] && [ "${REF}" = "refs/heads/main" ]; then
            first="$(printf '%s' "${HEAD_MSG}" | head -n1)"
            case "${first}" in
              "chore: pin muninn ->"*) mode=webhook ;;
            esac
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "classified mode=${mode}"

  build-and-push:
    needs: classify
    if: needs.classify.outputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags and metadata
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          APP_VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || echo '0.0.0')"
          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          TAGS="${IMAGE}:latest"
          TAGS="${TAGS},${IMAGE}:edge"
          TAGS="${TAGS},${IMAGE}:sha-${SHORT_SHA}"

          # When a v* git tag triggers the build, also publish the bare semver.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "${GITHUB_REF_NAME}" ]; then
            SEMVER="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS},${IMAGE}:${SEMVER}"
          fi

          {
            echo "tags=${TAGS}"
            echo "app_version=${APP_VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

          echo "Publishing tags:"
          echo "${TAGS}" | tr ',' '\n'

      # Homarr's Dockerfile is a self-contained multi-stage build (pnpm fetch/
      # install/turbo build -> alpine runner with nginx+redis+next). The TURBO_*
      # secret mounts are optional (build proceeds without a remote cache).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Muninn
            org.opencontainers.image.description=Self-hosted dashboard and app launcher (fork of Homarr) with a Cobalt UI, strict per-user RBAC, multi-provider OIDC, and a documented REST API.
            org.opencontainers.image.source=https://github.com/Emkraan/muninn
            org.opencontainers.image.url=https://github.com/Emkraan/muninn
            org.opencontainers.image.documentation=https://github.com/Emkraan/muninn
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.meta.outputs.app_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}

      # Deploy-bot App token, used to open the pin PR as the App (not
      # GITHUB_TOKEN) so the automerge workflow's pull_request trigger fires and
      # enqueues it. Pin PRs are only opened for pushes to main.
      - name: Mint deploy-bot app token
        if: github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@v3
        id: deploy-token
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      # Pin the new sha into portainer-stack.yml on a branch and open an
      # auto-merge PR. No direct push to main: the pin flows through the merge
      # queue. The PR title starts with "chore: pin muninn ->" so the
      # post-merge push classifies as webhook-only and triggers the redeploy.
      - name: Open pin PR (through the merge queue)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.deploy-token.outputs.token }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          NEW_TAG: sha-${{ steps.meta.outputs.short_sha }}
        run: |
          sed -i -E "s|(image:[[:space:]]+)${IMAGE}:[A-Za-z0-9._-]+|\1${IMAGE}:${NEW_TAG}|" portainer-stack.yml
          if git diff --quiet portainer-stack.yml; then
            echo "portainer-stack.yml already at ${NEW_TAG}; nothing to pin"
            exit 0
          fi

          BRANCH="ci/pin-${NEW_TAG}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # actions/checkout sets a GITHUB_TOKEN extraheader that wins over the
          # remote URL. Unset it so the app-token push is attributed to the App.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git checkout -b "${BRANCH}"
          git add portainer-stack.yml
          git commit -m "chore: pin muninn -> ${NEW_TAG}"
          git push -f origin "${BRANCH}"

          # Reuse an existing open PR for this branch, else open one. The
          # automerge workflow enqueues it once checks are green.
          if gh pr view "${BRANCH}" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "pin PR for ${BRANCH} already open"
          else
            gh pr create --base main --head "${BRANCH}" \
              --title "chore: pin muninn -> ${NEW_TAG}" \
              --body "Automated image pin to \`${NEW_TAG}\`. Flows through the merge queue; the merge triggers the Portainer redeploy of hq_muninn. Do not squash-edit the title."
          fi

  # Post-merge pass: the pin PR has landed on main. Fire the Portainer webhook
  # to redeploy hq_muninn from the freshly pinned portainer-stack.yml.
  redeploy:
    needs: classify
    if: needs.classify.outputs.mode == 'webhook' && vars.PORTAINER_WEBHOOK_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer redeploy (hq_muninn)
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
